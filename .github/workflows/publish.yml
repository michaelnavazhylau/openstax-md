name: Publish

# Releases are cut by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
#
# A manual dispatch defaults to TestPyPI only, so the pipeline can be validated
# without touching the real index. Pass target=pypi to publish for real (useful
# for recovering a partially failed release; TestPyPI re-uploads are no-ops).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python3 -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pkg"
            exit 1
          fi
          echo "Releasing openstax-md $pkg"

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/openstax-md
    permissions:
      id-token: write # OIDC trusted publishing; no API token secret needed
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running the workflow for an already-uploaded version is a no-op.
          skip-existing: true
          # TestPyPI accepts an API token so the pipeline can be exercised before
          # the trusted publisher exists there. The action selects trusted
          # publishing when the password is empty, so an unset secret falls back
          # to OIDC rather than failing.
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  pypi:
    name: Publish to PyPI
    needs: testpypi
    # Tag pushes always publish. A manual dispatch must opt in explicitly, so a
    # "just testing" run can never reach the real index by accident.
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openstax-md
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # No `password:` input here on purpose: the real index is reachable only
      # through OIDC trusted publishing, so no long-lived credential can ever be
      # used against PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
