name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: "Battle test scope (sample or all)"
        required: true
        default: "sample"
        type: choice
        options:
          - sample
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Run linting (ruff check)
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Run formatting check (ruff format)
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Run type checking (mypy)
        run: uv run --python ${{ matrix.python-version }} mypy src

      - name: Run unit tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=src/openstax_md --cov-report=xml --cov-report=term -m "not bundle"

      - name: Build wheel and sdist
        run: uv build

  packaging:
    name: Packaging & validation extra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Core wheel must not require setuptools
        run: |
          python3 - <<'PY'
          import glob, zipfile

          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith("METADATA"))
              meta = zf.read(name).decode()

          requires = [l for l in meta.splitlines() if l.startswith("Requires-Dist:")]
          core = [l for l in requires if "extra ==" not in l]
          extra_deps = [l for l in requires if l not in core]
          print("core:", core)
          print("extras:", extra_deps)

          assert not any("setuptools" in l for l in core), "setuptools leaked into core deps"
          assert any("validation" in l for l in extra_deps), "validation extra missing"
          assert "License-Expression: MIT" in meta, "PEP 639 license metadata missing"
          PY

      - name: Install the validation extra
        run: uv sync --no-default-groups --extra validation

      - name: cnxml bridge resolves the installed library
        run: |
          uv run --no-default-groups --extra validation python - <<'PY'
          from openstax_md import CnxmlLib

          lib = CnxmlLib.load()
          assert lib.available, lib.reason
          assert lib.validation_available, lib.reason
          print("cnxml bridge OK:", lib.source)
          PY

  katex-validation:
    name: KaTeX Math Validator (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install uv and build sample module
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: |
          uv sync --all-groups
          uv run pytest -m "not bundle"

  battle-test:
    name: Catalog Battle Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --python 3.12

      - name: Run catalog battle test
        run: |
          SCOPE="${{ inputs.scope || 'sample' }}"
          echo "Running battle test with scope: --$SCOPE"
          uv run --python 3.12 python scripts/bulk_test.py --$SCOPE --workers 4

      - name: Publish Battle-Test Summary
        if: always()
        run: |
          if [ -f "_osbooks/battle_test_report.md" ]; then
            cat _osbooks/battle_test_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Battle-Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-test-report
          path: |
            _osbooks/battle_test_report.md
            _osbooks/battle_test_report.json

