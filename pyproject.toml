[project]
name = "cnxml2md"
version = "0.2.0"
description = "Compile OpenStax CNXML/COLLXML bundles to Markdown (Python port of cnxml2md, with MathML→LaTeX, cross-reference resolution and collection-aware book builds)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "lxml>=5.0",
    # The upstream `cnxml` library (openstax/cnxml) uses pkg_resources for its
    # bundled RNG schemas + jing.jar; pkg_resources was removed in setuptools 81.
    "setuptools>=68,<81",
]

[project.scripts]
cnxml2md = "cnxml2md.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnxml2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "bundle: integration tests that need the osbooks-calculus-bundle checkout",
]
