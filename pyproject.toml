[project]
name = "cnxml2md"
version = "0.2.0"
description = "High-fidelity compiler transforming OpenStax CNXML/COLLXML textbooks into GitHub Flavored Markdown with LaTeX math, publisher-accurate numbering, and cross-reference resolution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Michael Navazhylau", email = "mikipux7@gmail.com" },
]
keywords = [
    "openstax",
    "cnxml",
    "collxml",
    "markdown",
    "mathml",
    "latex",
    "textbooks",
    "oer",
    "parser",
    "compiler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "lxml>=5.0",
    # The upstream `cnxml` library (openstax/cnxml) uses pkg_resources for its
    # bundled RNG schemas + jing.jar; pkg_resources was removed in setuptools 81.
    "setuptools>=68,<81",
]

[project.urls]
Homepage = "https://github.com/michaelnavazhylau/openstax-md"
Repository = "https://github.com/michaelnavazhylau/openstax-md"
Issues = "https://github.com/michaelnavazhylau/openstax-md/issues"

[project.scripts]
cnxml2md = "cnxml2md.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "lxml-stubs>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnxml2md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
markers = [
    "bundle: integration tests that need the osbooks-calculus-bundle checkout",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["cnxml2md"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "cnxml.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/cnxml2md"]
branch = true
omit = [
    "src/cnxml2md/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
