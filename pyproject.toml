[project]
name = "openstax-md"
version = "0.2.0"
description = "High-fidelity compiler transforming OpenStax CNXML/COLLXML textbooks into GitHub Flavored Markdown with LaTeX math, publisher-accurate numbering, and cross-reference resolution."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Navazhylau", email = "mikipux7@gmail.com" },
]
keywords = [
    "openstax",
    "cnxml",
    "collxml",
    "markdown",
    "mathml",
    "latex",
    "textbooks",
    "oer",
    "parser",
    "compiler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "lxml>=5.0",
]

[project.optional-dependencies]
# Bridge to the upstream `cnxml` library (openstax/cnxml) for CNXML/COLLXML RNG
# validation via its bundled jing.jar (needs a JRE on PATH).  Upstream imports
# pkg_resources, which setuptools 81 removed -- hence the pin, scoped to this
# extra instead of every installation.
validation = [
    "cnxml>=3.1",
    "setuptools>=68,<81",
]

[project.urls]
Homepage = "https://github.com/michaelnavazhylau/openstax-md"
Repository = "https://github.com/michaelnavazhylau/openstax-md"
Issues = "https://github.com/michaelnavazhylau/openstax-md/issues"
Changelog = "https://github.com/michaelnavazhylau/openstax-md/blob/main/CHANGELOG.md"
Documentation = "https://github.com/michaelnavazhylau/openstax-md/tree/main/docs"

[project.scripts]
openstax-md = "openstax_md.cli:main"
cnxml2md = "openstax_md.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "lxml-stubs>=0.5.1",
    # NOTE: the cnxml bridge is deliberately NOT a dev dependency. Base installs
    # (`pip install openstax-md`) never have it, so the default test suite must
    # keep exercising the built-in fallback. Use `uv sync --extra validation`
    # when you want the upstream metadata/validation paths (see Makefile).
]

# hatchling >= 1.27 is required for PEP 639 license expressions / license-files.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openstax_md"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to sources + tests + docs; developer-only tooling stays out.
exclude = [
    "uv.lock",
    "package.json",
    "package-lock.json",
    ".github/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
markers = [
    "bundle: integration tests that need the osbooks-calculus-bundle checkout",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["openstax_md"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "cnxml.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/openstax_md"]
branch = true
omit = [
    "src/openstax_md/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
