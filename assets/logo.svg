<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowOrange" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Emblem Gradients -->
    <linearGradient id="cnxmlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="mdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="tagBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters for Depth and Glow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .font-mono { font-family: "SF Mono", "Fira Code", "Roboto Mono", Menlo, Monaco, Consolas, monospace; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="216" rx="20" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="876" height="216" rx="20" fill="url(#glowOrange)"/>
  <rect x="2" y="2" width="876" height="216" rx="20" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="876" height="216" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Top Accent Highlight -->
  <path d="M 30 2 L 850 2" stroke="url(#borderGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- ==================== LEFT EMBLEM ==================== -->
  <g transform="translate(42, 28)" filter="url(#subtleShadow)">
    <!-- Outer Emblem Shield / Canvas -->
    <rect x="0" y="0" width="164" height="164" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="164" height="164" rx="28" fill="url(#glowOrange)" opacity="0.3"/>

    <!-- Left Page (OpenStax CNXML / MathML) -->
    <g transform="translate(18, 24)">
      <!-- Document Backing -->
      <path d="M 0 10 C 0 4, 4 0, 10 0 L 46 0 C 52 0, 56 4, 56 10 L 56 106 C 56 112, 52 116, 46 116 L 10 116 C 4 116, 0 112, 0 106 Z"
            fill="url(#cnxmlGrad)" opacity="0.15" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.8"/>
      
      <!-- Fold corner -->
      <path d="M 40 0 L 56 16 L 40 16 Z" fill="#ea580c" opacity="0.6"/>

      <!-- XML Tag Graphic (< >) -->
      <path d="M 17 28 L 9 36 L 17 44" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 39 28 L 47 36 L 39 44" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 30 25 L 25 47" fill="none" stroke="#fdba74" stroke-width="1.75" stroke-linecap="round"/>

      <!-- MathML Integral & Delta symbols -->
      <text x="14" y="74" fill="#fb923c" class="font-brand" font-size="22" font-style="italic">∫</text>
      <text x="25" y="74" fill="#fed7aa" class="font-mono" font-size="11" font-weight="600">dx</text>
      <text x="14" y="98" fill="#fb923c" class="font-brand" font-size="14">∑</text>
      <text x="29" y="98" fill="#fed7aa" class="font-mono" font-size="11">x²</text>
    </g>

    <!-- Transformation Flow: Electric Compiler Chevron (Center) -->
    <g transform="translate(74, 70)">
      <circle cx="8" cy="12" r="14" fill="#1e293b" stroke="url(#arrowGrad)" stroke-width="1.5"/>
      <path d="M 5 6 L 11 12 L 5 18" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
    </g>

    <!-- Right Page (Markdown + LaTeX) -->
    <g transform="translate(90, 24)">
      <!-- Document Backing -->
      <path d="M 0 10 C 0 4, 4 0, 10 0 L 46 0 C 52 0, 56 4, 56 10 L 56 106 C 56 112, 52 116, 46 116 L 10 116 C 4 116, 0 112, 0 106 Z"
            fill="url(#mdGrad)" opacity="0.18" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.9"/>
      
      <!-- Fold corner -->
      <path d="M 40 0 L 56 16 L 40 16 Z" fill="#2563eb" opacity="0.6"/>

      <!-- Markdown 'M' Logo & Arrow -->
      <rect x="8" y="24" width="40" height="24" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2"/>
      <!-- M letter -->
      <path d="M 13 41 L 13 31 L 18 36 L 23 31 L 23 41" fill="none" stroke="#38bdf8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Down arrow -->
      <path d="M 34 31 L 34 39 M 31 36 L 34 39 L 37 36" fill="none" stroke="#93c5fd" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Formatted LaTeX Math Preview lines -->
      <text x="10" y="73" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700">$$f(x)$$</text>
      <!-- Markdown document item bullets -->
      <circle cx="12" cy="88" r="2" fill="#60a5fa"/>
      <rect x="18" y="86" width="28" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
      <circle cx="12" cy="100" r="2" fill="#60a5fa"/>
      <rect x="18" y="98" width="22" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
    </g>
  </g>

  <!-- ==================== BRANDING & TYPOGRAPHY ==================== -->
  <g transform="translate(236, 42)">
    <!-- Primary Title & Version Chip -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" fill="url(#titleGrad)" class="font-brand" font-size="44" letter-spacing="-1">openstax-md</text>
      
      <!-- Python / cnxml2md sub-badge -->
      <rect x="270" y="-30" width="108" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="282" cy="-17" r="4" fill="#10b981"/>
      <text x="292" y="-13" fill="#cbd5e1" class="font-mono" font-size="12" font-weight="600">cnxml2md</text>

      <!-- Version Chip -->
      <rect x="386" y="-30" width="68" height="26" rx="13" fill="url(#tagBgGrad)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6"/>
      <text x="420" y="-13" fill="#93c5fd" class="font-mono" font-size="12" font-weight="700" text-anchor="middle">v0.2.0</text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="66" fill="#94a3b8" class="font-body" font-size="16" font-weight="400" letter-spacing="-0.2">
      High-Fidelity OpenStax CNXML &amp; MathML to GitHub-Flavored Markdown Compiler
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 94)">
      <!-- Chip 1: MathML -> LaTeX -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="28" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="18" fill="#fdba74" class="font-mono" font-size="11.5" font-weight="600">∑ MathML → LaTeX</text>
      </g>

      <!-- Chip 2: Zero Prose Loss -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="150" height="28" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="18" fill="#6ee7b7" class="font-mono" font-size="11.5" font-weight="600">✓ 100% Prose Kept</text>
      </g>

      <!-- Chip 3: Publisher Numbering -->
      <g transform="translate(308, 0)">
        <rect x="0" y="0" width="152" height="28" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="18" fill="#93c5fd" class="font-mono" font-size="11.5" font-weight="600"># Section Numbers</text>
      </g>

      <!-- Chip 4: Obsidian / Vault Ready -->
      <g transform="translate(470, 0)">
        <rect x="0" y="0" width="136" height="28" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="18" fill="#d8b4fe" class="font-mono" font-size="11.5" font-weight="600">⚡ PKM Vault Ready</text>
      </g>
    </g>
  </g>
</svg>
